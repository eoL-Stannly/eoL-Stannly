[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  external_node_modules = []
  node_bundler = "esbuild"

[functions."content-audit"]
  timeout = 120

[functions."seo-tool"]
  timeout = 120

[dev]
  command = "npm run dev:client"
  port = 3000
  targetPort = 5173

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
